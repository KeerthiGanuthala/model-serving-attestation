[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-attestation"
version = "0.1.0"
description = "In-process SHA-256 model weight attestation and rollout exposure auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anushka Yadav"}
]
dependencies = []

[project.optional-dependencies]
mlflow = [
    "mlflow>=2.9.0",
]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
]

[project.scripts]
model-serving-attestation = "attestation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
